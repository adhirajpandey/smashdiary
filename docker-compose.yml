# Local Postgres for development and tests. Not used in production.
services:
  db:
    image: postgres:17
    container_name: smashdiary-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smashdiary
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - smashdiary-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "smashdiary"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  smashdiary-db:
